<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>motion artwork</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #view {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
      touch-action: none;   /* 避免滑動觸發瀏覽器手勢/捲動 */
    }
    #startScreen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000; color: #eee; z-index: 100;
      font: 16px/1.6 -apple-system, "Noto Sans TC", sans-serif;
      text-align: center; padding: 24px;
    }
    #startBtn {
      margin-top: 24px; padding: 16px 40px;
      font-size: 18px; letter-spacing: 4px;
      background: #eee; color: #000; border: none;
      border-radius: 2px; cursor: pointer;
    }
    #startBtn:disabled { opacity: 0.4; }
    #hintText { max-width: 320px; color: #999; font-size: 13px; }
    #errorBox {
      display: none; margin-top: 20px; max-width: 320px;
      color: #ff6b6b; font-size: 13px;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="startScreen">
    <div id="hintText">
      請戴上耳機。點擊開始後,請允許「麥克風」與「動作感測器」權限。<br><br>
      靜止時畫面模糊、你聽見所在空間的聲音;<br>移動時畫面清晰、你聽見別處的日常。
    </div>
    <button id="startBtn">開始</button>
    <div id="errorBox"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
